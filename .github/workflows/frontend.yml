name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build de produção pega erro de import/sintaxe em toda a árvore de
      # componentes — é o gate real desta pipeline.
      - name: Build
        run: npm run build

      # Informativo por enquanto: há débito de lint pré-existente (nomes de
      # componente de uma palavra só nos primitivos do shadcn-vue, alguns
      # "props" não usados) que ainda não foi limpo — não bloqueia o CI até
      # isso ser endereçado à parte.
      - name: Lint (non-blocking)
        run: npx eslint . --max-warnings=0
        continue-on-error: true
